<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penanda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Baris Navigasi Atas (Tinggi 48px) -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="brand-title">
        <span class="brand-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path><path d="M6 6h10"></path><path d="M6 10h10"></path></svg>
        </span>
        Penanda <span class="brand-badge">v1</span>
      </div>
      <nav class="nav-tabs" role="tablist" aria-label="Modul Penanda">
        <button id="tab-indeks" class="nav-tab-btn active" data-tab="indeks" role="tab" aria-selected="true" aria-controls="panel-indeks">
          Indeks <span id="tab-count-indeks" class="nav-tab-count">0</span>
        </button>
        <button id="tab-todo" class="nav-tab-btn" data-tab="todo" role="tab" aria-selected="false" aria-controls="panel-todo">
          TodoList <span id="tab-count-todo" class="nav-tab-count">0</span>
        </button>
        <button id="tab-log" class="nav-tab-btn" data-tab="log" role="tab" aria-selected="false" aria-controls="panel-log">
          Log <span id="tab-count-log" class="nav-tab-count">0</span>
        </button>
      </nav>
    </div>
    <div class="top-bar-right">
      <div class="top-bar-actions">
        <button type="button" id="btn-export-json" class="btn btn-secondary btn-sm btn-topbar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Cadangkan
        </button>
        <button type="button" id="btn-import-json" class="btn btn-secondary btn-sm btn-topbar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Import
        </button>
        <button type="button" id="btn-contoh-json" class="btn btn-secondary btn-sm btn-topbar" title="Unduh contoh berkas untuk diisi lalu diimpor">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="12" y1="17" x2="12" y2="9"></line></svg>
          Contoh
        </button>
        <input type="file" id="import-file-input" class="file-input-hidden" accept="application/json,.json">
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <div id="status-bar" class="status-bar" aria-live="polite">Penanda</div>
      </div>
    </div>
  </header>

  <!-- Area Konten Utama -->
  <main class="main-content">
    <!-- Panel Indeks -->
    <section id="panel-indeks" class="tab-panel active" role="tabpanel" aria-labelledby="tab-indeks">
      <div class="placeholder-card">
        <h2>Modul Indeks</h2>
        <p>Pencarian, item kerja harian, dan kartu tag akan diimplementasikan pada tiket berikutnya.</p>
      </div>
    </section>

    <!-- Panel Todo -->
    <section id="panel-todo" class="tab-panel" role="tabpanel" aria-labelledby="tab-todo" hidden>
      <div class="todo-view-container">
        <div class="todo-header-row">
          <div class="todo-search-box">
            <input type="text" id="todo-search-input" class="search-input" placeholder="Cari TodoList" autocomplete="off">
          </div>
          <div class="todo-filter-group" role="group" aria-label="Saringan Status TodoList">
            <button type="button" class="btn btn-secondary btn-todo-filter active" data-filter="semua">Semua</button>
            <button type="button" class="btn btn-secondary btn-todo-filter" data-filter="belum">Belum</button>
            <button type="button" class="btn btn-secondary btn-todo-filter" data-filter="selesai">Selesai</button>
          </div>
          <button type="button" id="btn-tambah-todo" class="btn btn-primary btn-tambah">+ Tambah</button>
        </div>
        <div id="todo-list" class="todo-list">
          <!-- Daftar item todo dirender secara dinamis oleh app.js -->
        </div>
      </div>
    </section>

    <!-- Panel Log -->
    <section id="panel-log" class="tab-panel" role="tabpanel" aria-labelledby="tab-log" hidden>
      <div class="log-view-container">
        <div class="log-header-row">
          <div class="log-search-box">
            <input type="text" id="log-search-input" class="search-input" placeholder="Cari log" autocomplete="off">
          </div>
          <div class="log-date-filter-group" role="group" aria-label="Saringan Rentang Tanggal Log">
            <label class="log-date-filter" for="log-date-from">
              Dari<input type="date" id="log-date-from" class="form-input">
            </label>
            <label class="log-date-filter" for="log-date-sampai">
              Sampai<input type="date" id="log-date-sampai" class="form-input">
            </label>
          </div>
          <button type="button" id="btn-catat-log" class="btn btn-primary btn-tambah">+ Catat</button>
        </div>
        <div id="log-list" class="log-list">
          <!-- Daftar entri log dirender secara dinamis oleh app.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Status Bar Bawah -->
  <footer id="bottom-status-bar" class="bottom-status-bar">
    <div id="status-counts" class="status-counts"></div>
    <div class="status-shortcuts">
      <span class="status-shortcut-item"><span class="status-shortcut-key">[/]</span> Cari</span>
      <span class="status-shortcut-item"><span class="status-shortcut-key">[N]</span> Baru</span>
      <span class="status-shortcut-item"><span class="status-shortcut-key">[Esc]</span> Tutup panel</span>
    </div>
  </footer>

  <!-- Skrip dimuat biasa (bukan ES Module) agar kompatibel dengan protokol file:// -->
  <script src="search.js"></script>
  <script src="storage-adapter.js"></script>
  <script src="app.js"></script>
</body>
</html>
